name: recheck

# Re-reads each organization's own /.well-known/odp.json and writes the result back.
#
# Manual only in THIS repository. Its rows are synthetic — RFC 2606 documentation domains that
# serve nothing — so a nightly run would mark every one of them unreachable within three days
# and erase the worked example of each status this file exists to show. A directory holding real
# entries wants the schedule below instead, because a row nobody re-reads is a claim about the
# past:
#
#   on:
#     schedule:
#       - cron: "10 3 * * *"
#     workflow_dispatch:

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recheck
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tools/recheck.mjs
      - run: node tools/build.mjs
      - run: node tools/validate.mjs
      - name: Commit any change
        run: |
          if git diff --quiet; then
            echo "no change"
            exit 0
          fi
          git config user.name "odp-directory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "recheck: refresh directory statuses"
          git push
