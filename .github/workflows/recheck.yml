name: recheck

# Re-reads each organization's own /.well-known/odp.json and writes the result back.
#
# The real v0.7 directory is rechecked daily. Synthetic v0.6 examples are
# checked only on manual runs, so the scheduled job does not erase them.

on:
  schedule:
    - cron: "10 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recheck
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tools/recheck.mjs
        if: github.event_name == 'workflow_dispatch'
      - run: node tools/build.mjs
        if: github.event_name == 'workflow_dispatch'
      - run: node tools/validate.mjs
        if: github.event_name == 'workflow_dispatch'
      - run: node tools/recheck.mjs --v0.7
      - run: node tools/build.mjs --v0.7
      - run: node tools/validate.mjs --v0.7
      - name: Commit any change
        run: |
          if git diff --quiet; then
            echo "no change"
            exit 0
          fi
          git config user.name "odp-directory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- odp-directory-v0.6.csv directory.json tools/state/recheck-state.json odp-directory-v0.7.csv directory-v0.7.json tools/state/recheck-state-v0.7.json
          git commit -m "recheck: refresh directory statuses"
          git push
